name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inyectar secrets
        run: |
          sed -i 's|{{API_URL}}|${{ secrets.API_URL }}|g' index.html
          sed -i 's|{{ADMIN_PASS}}|${{ secrets.ADMIN_PASS }}|g' index.html

      - name: Commit y push con secrets inyectados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "deploy: inyectar secrets"
          git push